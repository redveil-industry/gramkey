name: Gramkey
options:
  bundleIdPrefix: com.redveil
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: S96G4A8FMK   # App Groups need a real team
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  Gramkey:
    type: application
    platform: iOS
    sources: [App, Shared, Keyboard/KeyboardView.swift]   # KeyboardView also powers the in-app preview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redveil.gramkey
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gramkey
        UILaunchScreen: {}
    entitlements:
      path: App/Gramkey.entitlements
      properties:
        com.apple.security.application-groups: [group.com.redveil.gramkey]
    dependencies:
      - target: GramkeyKeyboard
    scheme:
      testTargets: [GramkeyTests, GramkeyUITests]
  GramkeyKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redveil.gramkey.keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Gramkey
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true   # needed for Copy/Paste (UIPasteboard)
    entitlements:
      path: Keyboard/GramkeyKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.redveil.gramkey]
  GramkeyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Gramkey
  GramkeyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Gramkey
